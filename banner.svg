<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07061a"/>
      <stop offset="0.5" stop-color="#1b1647"/>
      <stop offset="0.78" stop-color="#4a2160"/>
      <stop offset="1" stop-color="#ff6a88" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1245"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#ff9a6a"/>
      <stop offset="1" stop-color="#ff4f87"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd7c2"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a88" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a88" stop-opacity="0"/>
    </radialGradient>
    <mask id="sunmask">
      <rect x="0" y="0" width="1000" height="228" fill="#fff"/>
      <rect x="0" y="176" width="1000" height="2" fill="#000"/>
      <rect x="0" y="190" width="1000" height="3" fill="#000"/>
      <rect x="0" y="203" width="1000" height="4" fill="#000"/>
      <rect x="0" y="216" width="1000" height="5" fill="#000"/>
    </mask>
    <clipPath id="floorclip"><rect x="0" y="228" width="1000" height="112"/></clipPath>
    <clipPath id="frame"><rect width="1000" height="340" rx="18"/></clipPath>

    <g id="cube">
      <polygon points="0,-30 26,-15 0,0 -26,-15" fill="#ffd27a"/>
      <polygon points="-26,-15 0,0 0,30 -26,15" fill="#ff6a88"/>
      <polygon points="26,-15 0,0 0,30 26,15" fill="#9b3d7a"/>
    </g>
    <g id="cubeAlt">
      <polygon points="0,-30 26,-15 0,0 -26,-15" fill="#b9a4ff"/>
      <polygon points="-26,-15 0,0 0,30 -26,15" fill="#7a5cf0"/>
      <polygon points="26,-15 0,0 0,30 26,15" fill="#4a2fa8"/>
    </g>
  </defs>

  <style>
    .title { font: 900 84px Georgia, 'Times New Roman', serif; letter-spacing: 4px; }
    .sub   { font: 600 17px 'Segoe UI', Arial, sans-serif; letter-spacing: 6px; fill: #ffd27a; }
    .b1 { animation: b1 5.5s ease-in-out infinite; }
    .b2 { animation: b2 7s ease-in-out infinite; }
    .b3 { animation: b3 4.8s ease-in-out infinite; }
    .spin  { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spinr { animation: spin 20s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
    .sway  { animation: sway 7s ease-in-out infinite; transform-origin: 500px 150px; }
    .beam  { animation: beam 7s ease-in-out infinite; }
    .tw1 { animation: tw 3s ease-in-out infinite; }
    .tw2 { animation: tw 4.2s ease-in-out infinite 1s; }
    .tw3 { animation: tw 2.6s ease-in-out infinite 0.5s; }
    .halo { animation: halo 4s ease-in-out infinite; transform-origin: 500px 228px; }
    @keyframes b1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes b2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(14px); } }
    @keyframes b3 { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-9px) scale(1.1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway { 0%,100% { transform: skewX(-2.5deg) translateX(-4px); } 50% { transform: skewX(2.5deg) translateX(4px); } }
    @keyframes beam { 0% { transform: translateX(-400px); } 100% { transform: translateX(1300px); } }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes halo { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  </style>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="1000" height="340" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle class="tw1" cx="70" cy="40" r="1.6"/>
      <circle class="tw2" cx="160" cy="95" r="1.2"/>
      <circle class="tw3" cx="300" cy="30" r="1.8"/>
      <circle class="tw1" cx="380" cy="80" r="1.1"/>
      <circle class="tw2" cx="620" cy="35" r="1.5"/>
      <circle class="tw3" cx="700" cy="85" r="1.2"/>
      <circle class="tw1" cx="840" cy="30" r="1.8"/>
      <circle class="tw2" cx="935" cy="90" r="1.3"/>
      <circle class="tw3" cx="510" cy="18" r="1.1"/>
    </g>

    <!-- sun with halo -->
    <ellipse class="halo" cx="500" cy="228" rx="260" ry="150" fill="url(#halo)"/>
    <g mask="url(#sunmask)"><circle cx="500" cy="228" r="112" fill="url(#sun)" opacity="0.92"/></g>

    <!-- floor -->
    <rect x="0" y="228" width="1000" height="112" fill="url(#floor)"/>
    <g clip-path="url(#floorclip)">
      <g stroke="#ff6a88" stroke-opacity="0.45" stroke-width="1.2">
        <line x1="500" y1="228" x2="-610" y2="340"/>
        <line x1="500" y1="228" x2="-500" y2="340"/>
        <line x1="500" y1="228" x2="-390" y2="340"/>
        <line x1="500" y1="228" x2="-280" y2="340"/>
        <line x1="500" y1="228" x2="-170" y2="340"/>
        <line x1="500" y1="228" x2="-60" y2="340"/>
        <line x1="500" y1="228" x2="50" y2="340"/>
        <line x1="500" y1="228" x2="160" y2="340"/>
        <line x1="500" y1="228" x2="270" y2="340"/>
        <line x1="500" y1="228" x2="380" y2="340"/>
        <line x1="500" y1="228" x2="500" y2="340"/>
        <line x1="500" y1="228" x2="620" y2="340"/>
        <line x1="500" y1="228" x2="730" y2="340"/>
        <line x1="500" y1="228" x2="840" y2="340"/>
        <line x1="500" y1="228" x2="950" y2="340"/>
        <line x1="500" y1="228" x2="1060" y2="340"/>
        <line x1="500" y1="228" x2="1170" y2="340"/>
        <line x1="500" y1="228" x2="1280" y2="340"/>
        <line x1="500" y1="228" x2="1390" y2="340"/>
        <line x1="500" y1="228" x2="1500" y2="340"/>
      </g>
      <!-- moving horizontal lines (accelerate toward viewer) -->
      <g fill="#ffb347">
        <rect x="0" width="1000" height="1.5">
          <animate attributeName="y" values="228;340" dur="3.6s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
          <animate attributeName="opacity" values="0;0.7;0.7" keyTimes="0;0.2;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" width="1000" height="1.5">
          <animate attributeName="y" values="228;340" dur="3.6s" begin="-0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
          <animate attributeName="opacity" values="0;0.7;0.7" keyTimes="0;0.2;1" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" width="1000" height="1.5">
          <animate attributeName="y" values="228;340" dur="3.6s" begin="-1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
          <animate attributeName="opacity" values="0;0.7;0.7" keyTimes="0;0.2;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" width="1000" height="1.5">
          <animate attributeName="y" values="228;340" dur="3.6s" begin="-2.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
          <animate attributeName="opacity" values="0;0.7;0.7" keyTimes="0;0.2;1" dur="3.6s" begin="-2.7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <!-- horizon glow line -->
    <rect x="0" y="227" width="1000" height="2" fill="#ffb347" opacity="0.85"/>

    <!-- floating 3D cubes -->
    <g class="b1"><g transform="translate(105,105) scale(1.7)"><g class="spin"><use href="#cube"/></g></g></g>
    <g class="b2"><g transform="translate(215,262) scale(0.85)"><use href="#cubeAlt"/></g></g>
    <g class="b3"><g transform="translate(60,250) scale(0.6)"><use href="#cube"/></g></g>
    <g class="b2"><g transform="translate(895,95) scale(1.4)"><g class="spinr"><use href="#cubeAlt"/></g></g></g>
    <g class="b1"><g transform="translate(830,262) scale(1.5)"><use href="#cube"/></g></g>
    <g class="b3"><g transform="translate(950,225) scale(0.6)"><use href="#cubeAlt"/></g></g>
    <g class="b1"><g transform="translate(250,48) scale(0.5)"><use href="#cube"/></g></g>
    <g class="b2"><g transform="translate(760,48) scale(0.5)"><use href="#cubeAlt"/></g></g>

    <!-- light beam -->
    <rect class="beam" x="0" y="0" width="260" height="340" fill="url(#beam)"/>

    <!-- 3D extruded title -->
    <g class="sway" text-anchor="middle">
      <text class="title" x="520" y="178" fill="#12082a">HAMID KAMAL</text>
      <text class="title" x="517" y="175" fill="#220f45">HAMID KAMAL</text>
      <text class="title" x="514" y="172" fill="#3a1a66">HAMID KAMAL</text>
      <text class="title" x="511" y="169" fill="#5c2a80">HAMID KAMAL</text>
      <text class="title" x="508" y="166" fill="#8a3a8a">HAMID KAMAL</text>
      <text class="title" x="505" y="163" fill="#c24a86">HAMID KAMAL</text>
      <text class="title" x="502" y="160" fill="#ff6a88">HAMID KAMAL</text>
      <text class="title" x="500" y="157" fill="url(#face)">HAMID KAMAL</text>
    </g>
    <text class="sub" x="500" y="205" text-anchor="middle">AI DEVELOPER · FOUNDER · SYSTEMS ARCHITECT</text>
  </g>

  <rect x="1" y="1" width="998" height="338" rx="17" fill="none" stroke="#ff6a88" stroke-opacity="0.35" stroke-width="2"/>
</svg>
